<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090907" />
  <title>NZXT Monolith</title>
  <link rel="stylesheet" href="styles.css?v=20260711-4" />
</head>
<body>
  <section id="setup" class="setup" hidden>
    <p class="setup-kicker">NZXT KRAKEN ELITE</p>
    <h1>Monolith</h1>
    <p>Concrete instrumentation with live NZXT CAM telemetry.</p>
    <label for="cam-url">CAM integration link</label>
    <input id="cam-url" readonly />
  </section>

  <main class="screen-shell">
    <div id="display" class="display" aria-label="NZXT Monolith system monitor">
      <div class="material" aria-hidden="true"></div>
      <div class="ambient-light" aria-hidden="true"></div>
      <div class="outer-bezel" aria-hidden="true"></div>
      <div class="outer-accent" aria-hidden="true"></div>



      <header class="brand" aria-label="NZXT Monolith">
        <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <p>MONOLITH</p>
      </header>

      <section class="hero-stat stat-liquid" aria-label="Liquid temperature">
        <span class="eyebrow"><i></i>LIQUID</span>
        <strong><span id="liquid-value">--</span><small>&deg;</small></strong>
        <span class="caption">COOLANT</span>
        <span class="accent-rule"></span>
      </section>

      <section class="hero-stat stat-power" aria-label="Combined CPU and GPU power">
        <span class="eyebrow"><i></i>POWER</span>
        <strong><span id="power-value">--</span><small>W</small></strong>
        <span class="caption">TOTAL DRAW</span>
        <span class="accent-rule"></span>
      </section>

      <section class="main-dial" aria-label="CPU temperature and load">
        <svg class="dial-svg" viewBox="0 0 250 250" aria-hidden="true">
          <circle class="dial-track" cx="125" cy="125" r="109" pathLength="100" />
          <circle id="cpu-arc" class="dial-progress" cx="125" cy="125" r="109" pathLength="100" />
        </svg>
        <div class="dial-ticks" aria-hidden="true"></div>
        <div id="dial-needle" class="dial-needle" aria-hidden="true"></div>
        <div class="dial-copy">
          <span class="dial-label"><i></i>CPU</span>
          <strong><span id="cpu-value">--</span><small>&deg;</small></strong>
          <span class="dial-caption">TEMPERATURE</span>
          <span id="cpu-load" class="dial-load">--% LOAD</span>
        </div>
      </section>

      <section class="side-stack stack-left" aria-label="Graphics and cooling telemetry">
        <article class="data-card card-gpu">
          <span class="card-icon icon-gpu" aria-hidden="true"></span>
          <div><span class="card-label">GPU TEMP</span><strong><span id="gpu-value">--</span><small>&deg;</small></strong></div>
          <span class="card-bar"><i id="gpu-bar"></i></span>
        </article>
        <article class="data-card card-gpu-load">
          <span class="card-icon icon-meter" aria-hidden="true"></span>
          <div><span class="card-label">GPU LOAD</span><strong><span id="gpu-load">--</span><small>%</small></strong></div>
          <span class="card-bar"><i id="gpu-load-bar"></i></span>
        </article>
        <article class="data-card card-pump">
          <span class="card-icon icon-pump" aria-hidden="true"></span>
          <div><span class="card-label">PUMP</span><strong><span id="pump-value">--</span><small>RPM</small></strong></div>
          <span class="card-bar"><i id="pump-bar"></i></span>
        </article>
      </section>

      <section class="side-stack stack-right" aria-label="Memory and processor telemetry">
        <article class="data-card card-ram">
          <span class="card-icon icon-ram" aria-hidden="true"></span>
          <div><span class="card-label">RAM USE</span><strong><span id="ram-value">--</span><small>%</small></strong></div>
          <span class="card-bar"><i id="ram-bar"></i></span>
        </article>
        <article class="data-card card-cpu-load">
          <span class="card-icon icon-chip" aria-hidden="true"></span>
          <div><span class="card-label">CPU LOAD</span><strong><span id="cpu-load-card">--</span><small>%</small></strong></div>
          <span class="card-bar"><i id="cpu-load-bar"></i></span>
        </article>
        <article class="data-card card-fan">
          <span class="card-icon icon-fan" aria-hidden="true"><i></i></span>
          <div><span class="card-label">FAN SPEED</span><strong><span id="fan-value">--</span><small>RPM</small></strong></div>
          <span class="card-bar"><i id="fan-bar"></i></span>
        </article>
      </section>

      <section class="clock-panel" aria-label="Clock and memory details">
        <span class="clock-icon" aria-hidden="true"></span>
        <div><strong id="clock">--:--:--</strong><span id="date">---</span></div>
        <span id="ram-detail" class="ram-detail">-- / -- GB</span>
      </section>
      <span id="data-state" hidden></span>

      <div class="glass" aria-hidden="true"></div>
    </div>
  </main>

  <script src="script.js?v=20260711-4"></script>
</body>
</html>
